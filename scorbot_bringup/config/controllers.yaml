# ros2_control configuration for one Scorbot arm.

controller_manager:
  ros__parameters:
    update_rate: 100 # Hz, matches the ESP32 streaming rate in the design

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    # Real hardware only
    system_controller:
      type: scorbot_system_controller/ScorbotSystemController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint
    interfaces:
      - position
      - velocity
      - effort

# Planned / point-to-point moves
joint_trajectory_controller:
  ros__parameters:
    joints:
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.5

# Live tracking loop
forward_velocity_controller:
  ros__parameters:
    joints:
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint

# ESP32 controller services
system_controller:
  ros__parameters:
    gpio_name: system
    joints:
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_pitch_joint
      - wrist_roll_joint
    home_timeout_s: 90.0
    request_timeout_s: 2.0
    status_rate_hz: 10.0
    link_timeout_ms: 100.0