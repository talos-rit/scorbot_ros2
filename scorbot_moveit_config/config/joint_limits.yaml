# Velocity and acceleration limits used by MoveIt's time parameterisation.
# Position limits come from the URDF. Values mirror scorbot_description's
# kinematics YAML (VERIFY: placeholders from the SolidWorks export) with a
# conservative acceleration. Keys are prefixed at launch when `prefix` is set.
default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  base_joint:
    has_velocity_limits: true
    max_velocity: 0.35
    has_acceleration_limits: true
    max_acceleration: 1.0
  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 0.45
    has_acceleration_limits: true
    max_acceleration: 1.0
  elbow_joint:
    has_velocity_limits: true
    max_velocity: 0.45
    has_acceleration_limits: true
    max_acceleration: 1.0
  wrist_pitch_joint:
    has_velocity_limits: true
    max_velocity: 1.4
    has_acceleration_limits: true
    max_acceleration: 3.0
  wrist_roll_joint:
    has_velocity_limits: true
    max_velocity: 1.8
    has_acceleration_limits: true
    max_acceleration: 3.0
