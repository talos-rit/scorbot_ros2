# Default inverse kinematics: KDL, position only.
#
# The arm has five joints, so it cannot reach an arbitrary 6-D pose. Full-pose KDL
# fails on almost every RViz marker drag; position_only_ik makes the interactive marker
# and pose goals usable while ignoring orientation. For camera work that wants "look
# at" behavior, see kinematics_pick_ik.yaml (approximate orientation with a cost).
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  position_only_ik: true
