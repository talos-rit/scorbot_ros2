# Per-joint calibration pushed to the ESP32 controller by scorbot_hardware at
# configure time (see project_documentation/technical/ros2/ros2_architecture.md, 5.3).
# The ESP stores it in NVS and uses it to convert encoder counts to joint radians,
# enforce soft limits, and run homing. Nothing in this file is compiled into firmware.
#
# Sources: project_documentation/hardware/motor_ratios.md and the previous team's
# esp-driver/main/esp_driver.c. Encoder wheels have 20 slots read x4 = 80 counts per
# motor revolution. Wrist ratios were marked uncertain by the previous team (VERIFY).
# home_offset_rad and home_direction are unknown until the limit switches are
# characterized on the robot (VERIFY).

robot_type: er_4pc
joints:
  base_joint:
    counts_per_motor_rev: 80
    gear_ratio: 635.5            # 127.1:1 motor x 120/24 gears
    home_offset_rad: 0.0         # VERIFY
    home_direction: -1           # VERIFY
    soft_limit_min_rad: -2.7053
    soft_limit_max_rad: 2.7053
    max_velocity_rad_s: 0.35
    max_accel_rad_s2: 1.0
    current_limit_a: 2.0         # VERIFY
    invert: false                # VERIFY: joint positive direction vs. motor
    encoder_invert: false        # VERIFY: count must rise on positive drive; the P0/P1 pad
                                 # order differs between the ER-4u and ER-Vplus manuals
  shoulder_joint:
    counts_per_motor_rev: 80
    gear_ratio: 457.56           # 127.1:1 motor x 72/20 gears
    home_offset_rad: 0.0         # VERIFY
    home_direction: -1           # VERIFY
    soft_limit_min_rad: -0.6109
    soft_limit_max_rad: 2.2689
    max_velocity_rad_s: 0.45
    max_accel_rad_s2: 1.0
    current_limit_a: 2.0         # VERIFY
    invert: false                # VERIFY: joint positive direction vs. motor
    encoder_invert: false        # VERIFY: count must rise on positive drive; the P0/P1 pad
                                 # order differs between the ER-4u and ER-Vplus manuals
  elbow_joint:
    counts_per_motor_rev: 80
    gear_ratio: 457.56
    home_offset_rad: 0.0         # VERIFY
    home_direction: -1           # VERIFY
    soft_limit_min_rad: -2.2689
    soft_limit_max_rad: 2.2689
    max_velocity_rad_s: 0.45
    max_accel_rad_s2: 1.0
    current_limit_a: 2.0         # VERIFY
    invert: false                # VERIFY: joint positive direction vs. motor
    encoder_invert: false        # VERIFY: count must rise on positive drive; the P0/P1 pad
                                 # order differs between the ER-4u and ER-Vplus manuals
  wrist_pitch_joint:
    counts_per_motor_rev: 80
    gear_ratio: 125.54           # 65.5:1 motor x 23/12 gears (VERIFY)
    home_offset_rad: 0.0         # VERIFY
    home_direction: -1           # VERIFY
    soft_limit_min_rad: -2.2689
    soft_limit_max_rad: 2.2689
    max_velocity_rad_s: 1.4
    max_accel_rad_s2: 3.0
    current_limit_a: 1.5         # VERIFY
    invert: false                # VERIFY: joint positive direction vs. motor
    encoder_invert: false        # VERIFY: count must rise on positive drive; the P0/P1 pad
                                 # order differs between the ER-4u and ER-Vplus manuals
  wrist_roll_joint:
    counts_per_motor_rev: 80
    gear_ratio: 125.54           # VERIFY
    home_offset_rad: 0.0         # VERIFY
    home_direction: -1           # VERIFY
    soft_limit_min_rad: -9.9484
    soft_limit_max_rad: 9.9484
    max_velocity_rad_s: 1.8
    max_accel_rad_s2: 3.0
    current_limit_a: 1.5         # VERIFY
    invert: false                # VERIFY: joint positive direction vs. motor
    encoder_invert: false        # VERIFY: count must rise on positive drive; the P0/P1 pad
                                 # order differs between the ER-4u and ER-Vplus manuals
